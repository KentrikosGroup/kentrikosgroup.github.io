<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kentrikos Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            position: relative;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #141822;
            border-left: 1px solid rgba(105, 125, 165, 0.085);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #334155, #475569);
            border-radius: 9999px;
            border: 1.5px solid rgba(115, 142, 186, 0.095);
            transition: background 0.2s ease;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #475569, #64748b);
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #334155 #141822;
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image:
                linear-gradient(rgba(205, 225, 250, 0.022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(210, 228, 248, 0.020) 1px, transparent 1px);
            background-size: 58px 58px;
            animation: gridMove 26s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-58px, -58px); }
        }

        .glow-one {
            position: fixed;
            width: 540px;
            height: 490px;
            background: radial-gradient(circle, rgba(84, 138, 204, 0.058), transparent 69%);
            top: 16%;
            left: 25%;
            transform: translate(-49%, -44%);
            z-index: 0;
            pointer-events: none;
        }

        .glow-two {
            position: fixed;
            width: 370px;
            height: 350px;
            background: radial-gradient(circle, rgba(118, 192, 244, 0.033), transparent 61%);
            bottom: 6%;
            right: 6%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 860px;
            width: 91%;
            padding: 66px 20px 74px 20px;
        }

        h1 {
            font-weight: 740;
            font-size: clamp(2.3rem, 6.4vw, 4.5rem);
            letter-spacing: -0.011em;
            background: linear-gradient(139deg, #e2e8f0 0%, #94a3b8 79%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 58px;
            line-height: 1.1;
        }

        .section-block {
            margin-bottom: 50px;
        }

        .section-label {
            font-size: 0.975rem;
            font-weight: 505;
            letter-spacing: 0.206em;
            text-transform: uppercase;
            color: rgba(158, 178, 203, 0.51);
            margin-bottom: 17px;
        }

        .section-divider {
            width: 44px;
            height: 1px;
            background: rgba(154, 176, 204, 0.164);
            margin: 0 auto 27px auto;
        }

        .btn {
            display: inline-block;
            padding: 14px 53px;
            font-size: 1.167rem;
            font-weight: 585;
            font-family: inherit;
            color: #ffffff;
            background: transparent;
            border: 1.375px solid rgba(153, 173, 199, 0.264);
            border-radius: 9999px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.226s ease;
            letter-spacing: 0.030em;
            backdrop-filter: blur(2px);
            box-shadow: 0 0 13px rgba(148, 170, 197, 0.041);
        }

        .btn:hover {
            border-color: rgba(177, 198, 230, 0.536);
            box-shadow: 0 0 34px rgba(157, 186, 219, 0.078);
            transform: scale(1.005);
        }

        .btn:active {
            transform: scale(0.953);
        }

        .org-link {
            position: fixed;
            left: 28px;
            bottom: 24px;
            z-index: 10;
            padding: 8px 4px;
            font-size: 0.86rem;
            font-weight: 500;
            font-family: inherit;
            letter-spacing: 0.02em;
            color: rgba(175, 190, 210, 0.4);
            text-decoration: none;
            background: transparent;
            border: none;
            transition: color 0.22s ease, text-shadow 0.22s ease, transform 0.22s ease;
        }

        .org-link:hover {
            color: #ffffff;
            text-shadow: 0 0 12px rgba(165, 195, 230, 0.55);
            transform: translateX(2px);
        }

        .org-link:active {
            transform: translateX(2px) scale(0.97);
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="glow-one"></div>
    <div class="glow-two"></div>

    <div class="container">
        <h1>Kentrikos Group<br>Homepage</h1>

        <div class="section-block">
            <div class="section-label">Check out our projects</div>
            <div class="section-divider"></div>

            <a href="https://github.com/KentrikosGroup/AzLauncher" target="_blank" rel="noopener noreferrer" class="btn">
                AzLauncher
            </a>
        </div>

        <div class="section-block">
            <div class="section-label">Check out our developers</div>
            <div class="section-divider"></div>

            <a href="https://github.com/VulicAzluk" target="_blank" rel="noopener noreferrer" class="btn">
                VulicAzluk
            </a>
        </div>
    </div>

    <a href="https://github.com/KentrikosGroup" target="_blank" rel="noopener noreferrer" class="org-link">
        Kentrikos Group Organization
    </a>

</body>
</html>
